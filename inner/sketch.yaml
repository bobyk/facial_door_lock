default_profile: ozobot_drvkit
profiles:
  ozobot_drvkit:
    fqbn: esp32:esp32:ozobot_drvkit:PinNumbers=byGPIONumber
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - VL53L1X (1.3.1)
      - RTClib (2.1.4)
      - Adafruit BusIO (1.17.4)
      - PubSubClient (2.8)
